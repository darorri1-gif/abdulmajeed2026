# Netlify deployment configuration
# The web app lives in apps/web; Netlify installs deps and builds there.

[build]
  base = "apps/web"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single-page app: all client routes fall back to index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Baseline security headers.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Long-cache hashed static assets.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Required environment variables (set in Netlify UI → Site settings → Environment):
#   VITE_SUPABASE_URL       = https://<your-school-project-ref>.supabase.co
#   VITE_SUPABASE_ANON_KEY  = <anon public key of the school project>
